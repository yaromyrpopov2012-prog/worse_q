name: Build worse_query IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'worse_query/**'
      - 'worse_query.xcodeproj/**'
      - '.github/workflows/build-ipa.yml'

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build iOS App
        run: |
          xcodebuild \
            -project worse_query.xcodeproj \
            -scheme worse_query \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/worse_query.app"

          test -d "$APP_PATH"

          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/

          cd build
          zip -qry worse_query-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: worse_query-unsigned-ipa
          path: build/worse_query-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
