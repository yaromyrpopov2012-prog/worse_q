name: Build worse_query IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Check Project
        run: |
          grep -E 'objectVersion|LastUpgradeCheck' \
            worse_query.xcodeproj/project.pbxproj

          xcodebuild -list \
            -project worse_query.xcodeproj

      - name: Build iOS App
        run: |
          xcodebuild \
            -project worse_query.xcodeproj \
            -scheme worse_query \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/worse_query.app"

          test -d "$APP_PATH"

          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/

          cd build
          zip -qry worse_query-unsigned.ipa Payload

          test -f worse_query-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: worse_query-unsigned-ipa
          path: build/worse_query-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
